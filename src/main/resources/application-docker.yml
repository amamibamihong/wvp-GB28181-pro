spring:
    # 上传文件大小限制
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 100MB
    cache:
        type: redis
    data:
        # REDIS数据库配置
        redis:
            # [必须修改] Redis服务器IP, REDIS安装在本机的,使用127.0.0.1
            host: ${REDIS_HOST:127.0.0.1}
            # [必须修改] 端口号
            port: ${REDIS_PORT:6379}
            # [可选] 数据库 DB
            database: ${REDIS_DB:6}
            # [可选] 访问密码,若你的redis服务器没有设置密码，就不需要用密码去连接
            password: ${REDIS_PWD:root}
            # [可选] 超时时间
            timeout: 10000
    # [必选] jdbc数据库配置
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/wvp2?useUnicode=true&characterEncoding=UTF8&rewriteBatchedStatements=true&serverTimezone=PRC&useSSL=false&allowMultiQueries=true
        username: root
        password: root123
# [可选] WVP监听的HTTP端口, 网页和接口调用都是这个端口
server:
    port: 18080

# 作为28181服务器的配置
sip:
    # [必须修改] 本机的IP，对应你的网卡，监听什么ip就是使用什么网卡，
    # 如果要监听多张网卡，可以使用逗号分隔多个IP， 例如： 192.168.1.4,10.0.0.4
    # 如果不明白，就使用0.0.0.0，大部分情况都是可以的
    # 请不要使用127.0.0.1，任何包括localhost在内的域名都是不可以的。
    ip: ${WVP_HOST:127.0.0.1}
    # [可选] 28181服务监听的端口
    port: ${WVP_PORT:5060}
    # 根据国标6.1.2中规定，domain宜采用ID统一编码的前十位编码。国标附录D中定义前8位为中心编码（由省级、市级、区级、基层编号组成，参照GB/T 2260-2007）
    # 后两位为行业编码，定义参照附录D.3
    # 3701020049标识山东济南历下区 信息行业接入
    # [可选]
    domain: ${WVP_DOMAIN:4401020049}
    # [可选]
    id: ${WVP_ID:44010200492000000001}
    # [可选] 公共认证密码 移除密码将必须提前添加设备才能通过认证
    password: ${WVP_PWD:admin123}

# GB35114 国密A级（证书认证 + 信令Note完整性）配置
gb35114:
    # [可选] 国密总开关，默认 false（关闭不影响原有 GB28181 Digest 注册）
    enabled: ${WVP_GB35114_ENABLED:false}
    # [可选] 本平台作为下级向上级平台注册时使用的设备证书ID（关联 wvp_gb35114_cert.id），为空时 UAC 侧国密注册走 Digest
    # 证书ID为空时可注释掉下面三行，避免空字符串绑定 Integer 失败；启用时填入 wvp_gb35114_cert.id
    # device-cert-id: ${WVP_GB35114_DEVICE_CERT_ID}
    # [可选] 本平台作为平台（UAS）使用的服务器证书ID，配置后注册方式为双向（Bidirection）
    # server-cert-id: ${WVP_GB35114_SERVER_CERT_ID}
    # [可选] 本平台受信的上级平台证书ID（UAC 侧验 sign2，双向时使用）
    # platform-cert-id: ${WVP_GB35114_PLATFORM_CERT_ID}
    # [可选] 私钥落地加密的对称密钥（至少 16 字节），生产环境务必修改
    key-encrypt-password: ${WVP_GB35114_KEY_PWD:wvp-gb35114-default}
    # [可选] 证书默认有效期（天）
    cert-validity-days: ${WVP_GB35114_CERT_VALIDITY_DAYS:3650}
    # [可选] 是否拒绝已过期的证书，默认 false（过期只在页面标出，不拦截注册；吊销始终拒绝）
    reject-expired-cert: ${WVP_GB35114_REJECT_EXPIRED_CERT:false}

#zlm 默认服务器配置
media:
    # [必须修改] zlm服务器唯一id，用于触发hook时区别是哪台服务器,general.mediaServerId
    id:
    # [必须修改] zlm服务器的内网IP
    ip: ${ZLM_HOST:127.0.0.1}
    # [必须修改] zlm服务器的http.port
    http-port: ${ZLM_PORT:80}
    # [可选] zlm服务器的hook.admin_params=secret
    secret: 035c73f7-bb6b-4889-a715-d9eb2d1925cc
    # 启用多端口模式, 多端口模式使用端口区分每路流，兼容性更好。 单端口使用流的ssrc区分， 点播超时建议使用多端口测试
    rtp:
        # [可选] 是否启用多端口模式, 开启后会在portRange范围内选择端口用于媒体流传输
        enable: true
        # [可选] 在此范围内选择端口用于媒体流传输,
        port-range: 30000,30500 # 端口范围
        # [可选] 国标级联在此范围内选择端口发送媒体流,
        send-port-range: 30000,30500 # 端口范围
    # 录像辅助服务， 部署此服务可以实现zlm录像的管理与下载， 0 表示不使用
    record-assist-port: 18081
    sdp-ip: ${sip.ip}
    stream-ip: ${sip.ip}

# [根据业务需求配置]
user-settings:
    # 推流直播是否录制
    record-push-live: true
    auto-apply-play: true
    # 设备注册时间列表最大保留条数，默认100，设置为0则不限制
    device-register-time-max-count: 100
    # 设备注册时间列表过期时间（小时），默认3，设置为0则永不过期
    device-register-time-ttl-hours: 3
    # 设备心跳时间列表最大保留条数，默认100，设置为0则不限制
    device-keepalive-time-max-count: 100
    # 设备心跳时间列表过期时间（小时），默认1，设置为0则永不过期
    device-keepalive-time-ttl-hours: 1
