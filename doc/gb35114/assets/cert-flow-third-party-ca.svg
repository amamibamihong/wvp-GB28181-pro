<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="840" viewBox="0 0 1520 840" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0.5 L11,4.5 L0,8.5 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="1520" height="840" fill="#ffffff"/>

  <text x="760" y="50" text-anchor="middle" font-size="31" font-weight="700" fill="#111">模式二：第三方 CA 签发</text>

  <!-- lane headers -->
  <rect x="210" y="76" width="400" height="42" rx="5" fill="#ececec"/>
  <text x="410" y="104" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1c1c">客户端</text>
  <rect x="630" y="76" width="400" height="42" rx="5" fill="#ececec"/>
  <text x="830" y="104" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1c1c">证书签发机构（第三方）</text>
  <rect x="1050" y="76" width="400" height="42" rx="5" fill="#ececec"/>
  <text x="1250" y="104" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1c1c">服务端（本平台）</text>

  <!-- lane dividers -->
  <line x1="620" y1="126" x2="620" y2="812" stroke="#c8c8c8" stroke-width="1.6" stroke-dasharray="7 6"/>
  <line x1="1040" y1="126" x2="1040" y2="812" stroke="#c8c8c8" stroke-width="1.6" stroke-dasharray="7 6"/>

  <!-- row separators -->
  <line x1="34" y1="292" x2="1486" y2="292" stroke="#e2e2e2" stroke-width="1.6" stroke-dasharray="7 6"/>
  <line x1="34" y1="512" x2="1486" y2="512" stroke="#e2e2e2" stroke-width="1.6" stroke-dasharray="7 6"/>

  <!-- ============ row 1 : 导入第三方 CA ============ -->
  <rect x="34" y="146" width="156" height="126" rx="9" fill="#333"/>
  <text x="112" y="198" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">① 导入</text>
  <text x="112" y="228" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">第三方 CA</text>

  <rect x="630" y="164" width="820" height="90" rx="9" fill="#e8860f"/>
  <text x="1040" y="200" text-anchor="middle" font-size="20" fill="#fff">第三方证书签发机构（独立系统，本平台不掌握其私钥）</text>
  <text x="1040" y="230" text-anchor="middle" font-size="20" fill="#fff">本平台只导入其 CA 证书，作为信任锚</text>

  <!-- ============ row 2 : 签发服务端证书 ============ -->
  <rect x="34" y="316" width="156" height="172" rx="9" fill="#333"/>
  <text x="112" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">② 签发</text>
  <text x="112" y="402" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">服务端</text>
  <text x="112" y="432" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">证书</text>

  <rect x="1050" y="322" width="400" height="96" rx="9" fill="#1f6fd0"/>
  <text x="1250" y="358" text-anchor="middle" font-size="19" fill="#fff">服务端生成密钥对 + CSR</text>
  <text x="1250" y="388" text-anchor="middle" font-size="19" fill="#fff">私钥不出本地</text>

  <rect x="630" y="322" width="400" height="96" rx="9" fill="#e8860f"/>
  <text x="830" y="358" text-anchor="middle" font-size="19" fill="#fff">第三方证书签发机构</text>
  <text x="830" y="388" text-anchor="middle" font-size="19" fill="#fff">用 CA 私钥签发</text>

  <line x1="1044" y1="370" x2="1034" y2="370" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#a)"/>

  <rect x="1050" y="446" width="400" height="48" rx="9" fill="#1f6fd0"/>
  <text x="1250" y="477" text-anchor="middle" font-size="19" fill="#fff">导入服务端证书（本平台）</text>
  <path d="M900,418 V470 H1044" fill="none" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#a)"/>

  <rect x="210" y="446" width="400" height="48" rx="9" fill="#7b2fbe"/>
  <text x="410" y="477" text-anchor="middle" font-size="19" fill="#fff">导入到客户端：服务端证书 + CA 证书</text>
  <path d="M700,418 V470 H616" fill="none" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- ============ row 3 : 签发客户端证书 + 平台侧信任建立 ============ -->
  <rect x="34" y="536" width="156" height="276" rx="9" fill="#333"/>
  <text x="112" y="600" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">③ 签发</text>
  <text x="112" y="630" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">客户端证书</text>
  <text x="112" y="660" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">与信任建立</text>

  <rect x="210" y="542" width="400" height="96" rx="9" fill="#3f9d4a"/>
  <text x="410" y="578" text-anchor="middle" font-size="19" fill="#fff">客户端生成密钥对 + CSR</text>
  <text x="410" y="608" text-anchor="middle" font-size="19" fill="#fff">私钥不出本地</text>

  <rect x="630" y="542" width="400" height="96" rx="9" fill="#e8860f"/>
  <text x="830" y="578" text-anchor="middle" font-size="19" fill="#fff">第三方证书签发机构</text>
  <text x="830" y="608" text-anchor="middle" font-size="19" fill="#fff">用 CA 私钥签发</text>

  <line x1="614" y1="590" x2="624" y2="590" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 客户端侧：证书 + CA 证书 -->
  <rect x="210" y="706" width="400" height="72" rx="9" fill="#7b2fbe"/>
  <text x="410" y="738" text-anchor="middle" font-size="18" fill="#fff">导入到客户端：</text>
  <text x="410" y="764" text-anchor="middle" font-size="18" fill="#fff">客户端证书 + 第三方 CA 证书</text>
  <path d="M700,638 V754 H616" fill="none" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 服务端侧：信任建立（原第 ④ 行并入此处） -->
  <rect x="1050" y="706" width="400" height="72" rx="9" fill="#1f6fd0"/>
  <text x="1250" y="738" text-anchor="middle" font-size="18" fill="#fff">导入客户端证书 + CA 证书</text>
  <text x="1250" y="764" text-anchor="middle" font-size="18" fill="#fff">逐个验签，任一通过即信任</text>
  <path d="M900,638 V754 H1044" fill="none" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#a)"/>
</svg>
